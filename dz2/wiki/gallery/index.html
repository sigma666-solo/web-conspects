<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Cats Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Главный контейнер галереи -->
    <div class="gallery-container">
        
        <!-- Заголовок галереи -->
        <h1>CATS GALLERY</h1>
        
        <!-- Блок для большого изображения -->
        <div class="main-image-box">
            <!-- По умолчанию открываем первую большую картинку -->
            <iframe src="images/cat_tied_256.png" name="big-picture" scrolling="no"></iframe>
        </div>
        
        <!-- Список маленьких изображений-ссылок -->
        <div class="thumbnails-list">
            
            <!-- Кот 1: в клубке -->
            <a href="images/cat_tied_256.png" target="big-picture">
                <img src="images/cat_tied_64.png" alt="Cat Tied">
            </a>
            
            <!-- Кот 2: белый грустный -->
            <a href="images/cat_eyes_256.png" target="big-picture">
                <img src="images/cat_eyes_64.png" alt="Cat Eyes">
            </a>
            
            <!-- Кот 3: серый лежит -->
            <a href="images/cat_purr_256.png" target="big-picture">
                <img src="images/cat_purr_64.png" alt="Cat Purr">
            </a>
            
            <!-- Кот 4: рыжий в клетке/переноске -->
            <a href="images/cat_cage_256.png" target="big-picture">
                <img src="images/cat_cage_64.png" alt="Cat Cage">
            </a>
            
            <!-- Кот 5: серый моется -->
            <a href="images/cat_clean_256.png" target="big-picture">
                <img src="images/cat_clean_64.png" alt="Cat Clean">
            </a>
            
            <!-- Кот 6: в коробке -->
            <a href="images/cat_box_256.png" target="big-picture">
                <img src="images/cat_box_64.png" alt="Cat Box">
            </a>
            
        </div>

    </div>

</body>
</html>
