<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Cats Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="gallery">
    <h1>CATS GALLERY</h1>
    
    <div class="big-image-container">
        <img id="main-pic" src="images/cat_tied_256.png" alt="Cat">
    </div>
    
    <div class="thumbnails-container">
        <img src="images/cat_tied_64.png" onclick="document.getElementById('main-pic').src='images/cat_tied_256.png'">
        <img src="images/cat_clean_64.png" onclick="document.getElementById('main-pic').src='images/cat_clean_256.png'">
        <img src="images/cat_eyes_64.png" onclick="document.getElementById('main-pic').src='images/cat_eyes_256.png'">
        <img src="images/cat_cage_64.png" onclick="document.getElementById('main-pic').src='images/cat_cage_256.png'">
        <img src="images/cat_purr_64.png" onclick="document.getElementById('main-pic').src='images/cat_purr_256.png'">
        <img src="images/cat_box_64.png" onclick="document.getElementById('main-pic').src='images/cat_box_256.png'">
    </div>
</div>

</body>
</html>
