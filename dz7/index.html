<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Card Details</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <form class="card-form" onsubmit="return false;">
        <div class="form-header">CREDIT CARD DETAILS</div>

        <div class="input-group">
            <label for="card-number">Card Number</label>
            <input type="text" id="card-number" placeholder="1234 5678 9012 3456" maxlength="19">
        </div>

        <div class="input-group">
            <label for="card-holder">Name On Card</label>
            <input type="text" id="card-holder" placeholder="Name Surname">
        </div>

        <div class="form-row">
            <div class="expiry-block">
                <label>Expiry Date</label>
                <div class="expiry-inputs">
                    <input type="text" placeholder="02" maxlength="2">
                    <input type="text" placeholder="2017" maxlength="4">
                </div>
            </div>

            <div class="cvv-block">
                <label for="cvv">CVV / CVN</label>
                <input type="password" id="cvv" placeholder="***" maxlength="3">
            </div>
        </div>
    </form>

</body>
</html>
