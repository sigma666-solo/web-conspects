<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Fruit List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Упорядоченный список фруктов -->
    <ol class="fruit-list">
        <li><span>Apple</span></li>
        <!-- Добавляем класс 'active' для элемента с особым фоном -->
        <li class="active"><span>Orange</span></li>
        <li><span>Pineapple</span></li>
        <li><span>Pear</span></li>
        <li><span>Cherry</span></li>
    </ol>

</body>
</html>
